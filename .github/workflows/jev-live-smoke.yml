name: jev-live-smoke

on:
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: "Optional phase0-scale run to review with NIST image anchors; empty runs the existing smoke test"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL }}
      TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL }}
      TYPESAFE_API_AUTH_HEADER: ${{ vars.TYPESAFE_API_AUTH_HEADER }}
      TYPESAFE_API_AUTH_PREFIX: ${{ vars.TYPESAFE_API_AUTH_PREFIX }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Verify Jev configuration
        run: archive-ingest jev-config-check

      - name: Run controlled Jev smoke queue
        if: inputs.archive_run_id == ''
        run: |
          mkdir -p artifacts
          archive-ingest --collection wikileaks run-jev-decisions             src/evidence_collections/wikileaks/fixtures/jev_smoke_requests.jsonl             --output artifacts/jev-smoke-decisions.jsonl             --proposal-output artifacts/jev-smoke-proposals.jsonl             --agent-version jev-live-smoke-v1

      - name: Print secret-safe decision summary
        if: inputs.archive_run_id == ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decisions = [
              json.loads(line)
              for line in Path("artifacts/jev-smoke-decisions.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          print(f"decisions={len(decisions)}")
          for item in decisions:
              print(
                  json.dumps(
                      {
                          "question": item.get("question"),
                          "subject_id": item.get("subject_id"),
                          "object_id": item.get("object_id"),
                          "answer": item.get("answer"),
                          "confidence": item.get("confidence"),
                          "routing": item.get("routing"),
                          "proposal_id": item.get("proposal_id"),
                      },
                      sort_keys=True,
                  )
              )
          PY

      - name: Order archived media against NIST image anchors
        if: inputs.archive_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          gh run download "$ARCHIVE_RUN_ID" --name phase0-scale-corpus --dir corpus
          mkdir -p artifacts
          cp corpus/archive.sqlite artifacts/anchor-ordered.sqlite
          python -m evidence_collections.september11.anchor_ordering \
            --database artifacts/anchor-ordered.sqlite --output artifacts --jev

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jev-live-smoke
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
