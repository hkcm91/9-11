name: wikileaks-sample

on:
  workflow_dispatch:
    inputs:
      plusd_url:
        description: HTTPS URL to a Cablegate/PlusD CSV export
        required: false
        default: ""
      war_diaries_url:
        description: HTTPS URL to an Iraq/Afghan War Diaries CSV export
        required: false
        default: ""
      sample_limit:
        description: Maximum records imported from each supplied dataset
        required: false
        default: "100"
      run_jev:
        description: Run generated resolution candidates through TypeSafe Jev
        required: false
        type: boolean
        default: false
      jev_candidate_limit:
        description: Maximum Jev decisions for calibration
        required: false
        default: "25"

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL }}
      TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL }}
      TYPESAFE_API_AUTH_HEADER: ${{ vars.TYPESAFE_API_AUTH_HEADER }}
      TYPESAFE_API_AUTH_PREFIX: ${{ vars.TYPESAFE_API_AUTH_PREFIX }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Check optional Jev configuration
        run: archive-ingest jev-config-check || true

      - name: Validate optional public dataset URLs
        env:
          PLUSD_URL: ${{ inputs.plusd_url }}
          WAR_URL: ${{ inputs.war_diaries_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          for url in filter(None, [os.environ.get("PLUSD_URL", ""), os.environ.get("WAR_URL", "")]):
              parsed = urlparse(url)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise SystemExit(f"Only public HTTPS dataset URLs are accepted: {url}")
          PY

      - name: Download supplied datasets or fetch default real public samples
        env:
          PLUSD_URL: ${{ inputs.plusd_url }}
          WAR_URL: ${{ inputs.war_diaries_url }}
          LIMIT: ${{ inputs.sample_limit }}
        run: |
          mkdir -p artifacts/input artifacts/raw artifacts/reports
          if [ -n "$PLUSD_URL" ] || [ -n "$WAR_URL" ]; then
            if [ -n "$PLUSD_URL" ]; then
              curl --fail --location --retry 3 --retry-delay 2 "$PLUSD_URL" -o artifacts/input/plusd.csv
            fi
            if [ -n "$WAR_URL" ]; then
              curl --fail --location --retry 3 --retry-delay 2 "$WAR_URL" -o artifacts/input/war-diaries.csv
            fi
            echo "WIKILEAKS_DEFAULT_REAL_SOURCES=0" >> "$GITHUB_ENV"
          else
            archive-ingest fetch-wikileaks-real-samples \
              --output-dir artifacts/input \
              --limit "$LIMIT" \
              --manifest artifacts/reports/bulk-source-manifest.json
            echo "WIKILEAKS_DEFAULT_REAL_SOURCES=1" >> "$GITHUB_ENV"
          fi

      - name: Normalize real samples
        env:
          LIMIT: ${{ inputs.sample_limit }}
        run: |
          if [ -f artifacts/input/plusd.csv ]; then
            archive-ingest import-wikileaks-plusd artifacts/input/plusd.csv --limit "$LIMIT" --output artifacts/raw/plusd.jsonl
          fi
          if [ -f artifacts/input/war-diaries.csv ]; then
            archive-ingest import-wikileaks-war-diaries artifacts/input/war-diaries.csv --limit "$LIMIT" --output artifacts/raw/war-diaries.jsonl
          fi
          if ! compgen -G "artifacts/raw/*.jsonl" > /dev/null; then
            echo "No real WikiLeaks samples were normalized" >&2
            exit 1
          fi

      - name: Exercise shared evidence pipeline
        run: |
          archive-ingest --collection wikileaks profile-jsonl artifacts/raw/*.jsonl --output artifacts/reports/profile.json
          archive-ingest --collection wikileaks dedupe-jsonl artifacts/raw/*.jsonl --threshold 0.86 --output artifacts/reports/duplicate-candidates.jsonl
          archive-ingest --collection wikileaks derive-temporal-claims artifacts/raw/*.jsonl --output artifacts/reports/temporal-claims.jsonl
          archive-ingest --collection wikileaks derive-spatial-claims artifacts/raw/*.jsonl --output artifacts/reports/spatial-claims.jsonl
          archive-ingest --collection wikileaks derive-entity-claims artifacts/raw/*.jsonl --output artifacts/reports/entity-claims.jsonl
          archive-ingest --collection wikileaks prioritize-jsonl artifacts/raw/*.jsonl --output artifacts/reports/enrichment-priority.jsonl
          archive-ingest --collection wikileaks build-work-queue artifacts/raw/*.jsonl --output artifacts/reports/work-queue.jsonl
          archive-ingest --collection wikileaks build-store \
            --database artifacts/wikileaks.sqlite \
            --records artifacts/raw/*.jsonl \
            --temporal artifacts/reports/temporal-claims.jsonl \
            --spatial artifacts/reports/spatial-claims.jsonl \
            --entities artifacts/reports/entity-claims.jsonl \
            --stats-output artifacts/reports/store-stats.json
          archive-ingest --collection wikileaks build-graph artifacts/raw/*.jsonl \
            --database artifacts/wikileaks.sqlite \
            --stats-output artifacts/reports/graph-stats.json
          archive-ingest --collection wikileaks analyze-graph-quality \
            --database artifacts/wikileaks.sqlite \
            --json-output artifacts/reports/graph-quality.json \
            --markdown-output artifacts/reports/graph-quality.md \
            --high-degree-threshold 20
          archive-ingest --collection wikileaks build-resolution-candidates \
            --database artifacts/wikileaks.sqlite \
            --output artifacts/reports/resolution-candidates.jsonl \
            --max-entity-pairs 500 \
            --max-event-pairs 500

      - name: Run capped resolution candidates through Jev
        if: ${{ inputs.run_jev }}
        env:
          JEV_LIMIT: ${{ inputs.jev_candidate_limit }}
        run: |
          archive-ingest --collection wikileaks run-jev-decisions \
            artifacts/reports/resolution-candidates.jsonl \
            --output artifacts/reports/resolution-decisions.jsonl \
            --proposal-output artifacts/reports/resolution-proposals.jsonl \
            --agent-version jev-http-v1 \
            --limit "$JEV_LIMIT"

      - name: Build Jev calibration report
        if: ${{ inputs.run_jev }}
        run: |
          archive-ingest --collection wikileaks analyze-jev-calibration \
            artifacts/reports/resolution-decisions.jsonl \
            --json-output artifacts/reports/jev-calibration.json \
            --markdown-output artifacts/reports/jev-calibration.md

      - name: Validate requested real-batch coverage
        env:
          PLUSD_URL: ${{ inputs.plusd_url }}
          WAR_URL: ${{ inputs.war_diaries_url }}
          LIMIT: ${{ inputs.sample_limit }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = int(os.environ["LIMIT"])
          failures = []
          using_defaults = os.environ.get("WIKILEAKS_DEFAULT_REAL_SOURCES") == "1"

          def jsonl_count(path: str) -> int:
              file = Path(path)
              if not file.exists():
                  return 0
              return sum(1 for line in file.read_text(encoding="utf-8").splitlines() if line.strip())

          # Coverage is an ingestion assertion, so count normalized source rows
          # before reconciliation/deduplication. The profile intentionally
          # collapses stable duplicate IDs and may therefore be smaller.
          if os.environ.get("PLUSD_URL") or using_defaults:
              actual = jsonl_count("artifacts/raw/plusd.jsonl")
              if actual < required:
                  failures.append(f"Cablegate requested {required}, normalized {actual}")

          if os.environ.get("WAR_URL") or using_defaults:
              actual = jsonl_count("artifacts/raw/war-diaries.jsonl")
              if actual < required:
                  failures.append(f"War Diaries requested {required}, normalized {actual}")

          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wikileaks-sample
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
