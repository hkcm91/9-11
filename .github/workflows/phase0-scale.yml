name: phase0-scale

on:
  push:
    branches: [main]
    paths:
      - "src/archive/explorer_export.py"
      - "src/archive/adapters/arcgis_photo_map.py"
      - "src/archive/adapters/internet_archive.py"
      - "apps/web-explorer/**"
      - "pyproject.toml"
      - ".github/workflows/phase0-scale.yml"
  pull_request:
    paths:
      - "src/archive/explorer_export.py"
      - "tests/test_explorer_export.py"
      - "tests/test_arcgis_photo_map.py"
      - "tests/test_internet_archive_adapter.py"
      - "src/archive/adapters/arcgis_photo_map.py"
      - "src/archive/adapters/internet_archive.py"
      - "apps/web-explorer/**"
      - "pyproject.toml"
      - ".github/workflows/phase0-scale.yml"
  workflow_dispatch:
    inputs:
      internet_archive_limit:
        description: Internet Archive metadata records
        required: false
        default: "500"
      photo_map_limit:
        description: archDisk point-photo records
        required: false
        default: "300"
      nist_organized_limit:
        description: NIST organized photo/video asset records
        required: false
        default: "250"
      jev_timing_limit:
        description: "Jev timing support reviews (0 disables; maximum 500)"
        required: false
        default: "0"

concurrency:
  group: phase0-scale
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Collect institutional and mapped-photo metadata
        run: |
          mkdir -p artifacts/raw artifacts/reports
          archive-ingest sample-nist --delay 0.25 --output artifacts/raw/nist-repository.jsonl
          archive-ingest sample-nist-organized --limit "${{ inputs.nist_organized_limit || '250' }}" --delay 0.2 --output artifacts/raw/nist-organized-media.jsonl
          archive-ingest sample-photo-map --limit "${{ inputs.photo_map_limit || '300' }}" --delay 0.2 --output artifacts/raw/archdisk-photo-map.jsonl

      - name: Collect reconstruction-oriented September 11 Digital Archive collections
        run: |
          archive-ingest sample-911da --collection 267 --details --limit 100 --delay 0.25 --output artifacts/raw/911da-voices.jsonl
          archive-ingest sample-911da --collection 266 --details --limit 75 --delay 0.25 --output artifacts/raw/911da-sonic-memorial.jsonl
          archive-ingest sample-911da --collection 11 --details --limit 39 --delay 0.25 --output artifacts/raw/911da-fdny-plans.jsonl

      - name: Collect Internet Archive broadcast metadata
        run: |
          archive-ingest sample-internet-archive --limit "${{ inputs.internet_archive_limit || '500' }}" --delay 0.25 --output artifacts/raw/internet-archive.jsonl
          archive-ingest sample-internet-archive --details --limit 150 --delay 0.25 --output artifacts/raw/internet-archive-details.jsonl

      - name: Build normalized research outputs
        run: |
          archive-ingest profile-jsonl artifacts/raw/*.jsonl --output artifacts/reports/profile.json
          archive-ingest dedupe-jsonl artifacts/raw/*.jsonl --threshold 0.86 --output artifacts/reports/duplicate-candidates.jsonl
          archive-ingest derive-temporal-claims artifacts/raw/*.jsonl --output artifacts/reports/temporal-claims.jsonl
          archive-ingest derive-spatial-claims artifacts/raw/*.jsonl --output artifacts/reports/spatial-claims.jsonl
          archive-ingest derive-entity-claims artifacts/raw/*.jsonl --output artifacts/reports/entity-claims.jsonl
          archive-ingest prioritize-jsonl artifacts/raw/*.jsonl --output artifacts/reports/enrichment-priority.jsonl
          archive-ingest build-work-queue artifacts/raw/*.jsonl --output artifacts/reports/work-queue.jsonl
          archive-ingest build-rights-queue artifacts/raw/*.jsonl --output artifacts/reports/rights-queue.jsonl

      - name: Materialize SQLite evidence store
        run: |
          archive-ingest build-store \
            --database artifacts/archive.sqlite \
            --records artifacts/raw/*.jsonl \
            --temporal artifacts/reports/temporal-claims.jsonl \
            --spatial artifacts/reports/spatial-claims.jsonl \
            --entities artifacts/reports/entity-claims.jsonl \
            --stats-output artifacts/reports/store-stats.json

      - name: Review media timing support with Jev
        if: github.event_name == 'workflow_dispatch' && inputs.jev_timing_limit != '0' && inputs.jev_timing_limit != ''
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL }}
          JEV_TIMING_LIMIT: ${{ inputs.jev_timing_limit }}
        run: |
          python -m evidence_collections.september11.media_timing \
            --database artifacts/archive.sqlite --output artifacts/reports \
            --limit "$JEV_TIMING_LIMIT"

      - name: Build static Explorer MVP artifact
        run: |
          mkdir -p artifacts/explorer/data
          archive-export-explorer \
            --database artifacts/archive.sqlite \
            --output artifacts/explorer/data/explorer.json \
            --start 2001-09-11T08:00:00-04:00 \
            --end 2001-09-11T12:00:00-04:00
          cp apps/web-explorer/index.html artifacts/explorer/
          cp apps/web-explorer/styles.css artifacts/explorer/
          cp apps/web-explorer/app.js artifacts/explorer/
          cp apps/web-explorer/*.mjs artifacts/explorer/
          cp apps/web-explorer/ordering.json artifacts/explorer/

      - name: Write scale summary and manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from pathlib import Path
          from archive.store import ArchiveStore

          def read_jsonl(path):
              p = Path(path)
              if not p.exists():
                  return []
              return [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]

          profile = json.loads(Path("artifacts/reports/profile.json").read_text(encoding="utf-8"))
          store_stats = json.loads(Path("artifacts/reports/store-stats.json").read_text(encoding="utf-8"))
          with ArchiveStore("artifacts/archive.sqlite") as store:
              store_stats["table_counts"] = store.stats()
          Path("artifacts/reports/store-stats.json").write_text(json.dumps(store_stats, indent=2) + "\n", encoding="utf-8")
          temporal = read_jsonl("artifacts/reports/temporal-claims.jsonl")
          spatial = read_jsonl("artifacts/reports/spatial-claims.jsonl")
          entities = read_jsonl("artifacts/reports/entity-claims.jsonl")
          research = read_jsonl("artifacts/reports/work-queue.jsonl")
          rights = read_jsonl("artifacts/reports/rights-queue.jsonl")
          duplicates = read_jsonl("artifacts/reports/duplicate-candidates.jsonl")

          raw_counts = {
              p.name: sum(1 for line in p.read_text(encoding="utf-8").splitlines() if line.strip())
              for p in sorted(Path("artifacts/raw").glob("*.jsonl"))
          }
          summary = {
              "raw_observations": sum(raw_counts.values()),
              "records_by_file": raw_counts,
              "unique_reconciled_records": profile.get("total_records"),
              "source_counts": profile.get("source_counts"),
              "populated_percent": profile.get("populated_percent"),
              "cross_source_duplicate_candidates": len(duplicates),
              "temporal_claims": len(temporal),
              "temporal_claim_kinds": dict(Counter(x["time_kind"] for x in temporal)),
              "spatial_claims": len(spatial),
              "spatial_claim_kinds": dict(Counter(x["location_kind"] for x in spatial)),
              "entity_claims": len(entities),
              "entity_relation_counts": dict(Counter(x["role"] for x in entities)),
              "research_tasks": len(research),
              "research_task_counts": dict(Counter(x["task_type"] for x in research)),
              "rights_clearance_tasks": len(rights),
              "sqlite_store": store_stats,
          }
          Path("artifacts/reports/scale-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          files = []
          for path in sorted(Path("artifacts").rglob("*")):
              if path.is_file():
                  data = path.read_bytes()
                  files.append({"path": str(path), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          Path("artifacts/manifest.json").write_text(json.dumps({"files": files}, indent=2) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase0-scale-corpus
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

