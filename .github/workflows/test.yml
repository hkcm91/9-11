name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev,bulk-documents]
      - run: pytest -q
      - name: Check Explorer JavaScript syntax
        run: |
          node --check apps/web-explorer/app.js
          node --check src/archive/library.js
          node --check apps/web-explorer/tower-layer.mjs
      - name: Test Explorer historical scene
        run: node --test apps/web-explorer/*.test.mjs
