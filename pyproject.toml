[project]
name = "nine-eleven-archive"
version = "0.1.0"
description = "Research pipeline and API skeleton for a provenance-first September 11 interactive archive"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "py7zr>=0.22",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
archive-ingest = "archive.cli:main"
archive-query = "archive.query_cli:main"
archive-photo-map-info = "archive.photo_map_inventory:main"
archive-export-explorer = "archive.explorer_export:main"
archive-library = "archive.library_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
documents = ["pypdf>=5"]
bulk-documents = ["pypdf>=5", "pymupdf>=1.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archive" = ["library.html", "library.js"]
# Collections ship their ontology, source registry and fixtures as data.
"evidence_collections.september11" = ["*.yaml", "anchors/*.json"]
"evidence_collections.demo_history" = ["*.yaml", "fixtures/*.jsonl"]
"evidence_collections.wikileaks" = ["*.yaml", "fixtures/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
